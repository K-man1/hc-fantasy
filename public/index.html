<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hack Club Fantasy</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f7fb;
            color: #1f2937;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 420px);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #ec3750;
            font-size: 13px;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .card {
            padding: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.09);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -0.04em;
        }

        .label {
            margin: 28px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .count {
            min-height: 72px;
            margin: 2px 0 0;
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 1.1;
        }

        .status {
            min-height: 20px;
            margin: 10px 0 24px;
            color: #6b7280;
            font-size: 14px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            background: #1f2937;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #111827;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Hack Club Fantasy</p>
        <section class="card">
            <h1>#hc-fantasy</h1>
            <p class="label">Messages since October 4</p>
            <p class="count" id="message-count" aria-live="polite">--</p>
            <p class="status" id="status">Loading channel activity...</p>
            <button id="refresh" type="button">Refresh count</button>
        </section>
    </main>

    <script>
        const count = document.querySelector("#message-count");
        const status = document.querySelector("#status");
        const refresh = document.querySelector("#refresh");

        async function loadCount() {
            refresh.disabled = true;
            status.textContent = "Loading channel activity...";

            try {
                const response = await fetch("/api/count", {cache: "no-store"});
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Could not load the count");
                }

                count.textContent = String(result.messageCount);
                status.textContent = "Updated just now";
            } catch (error) {
                count.textContent = "--";
                status.textContent = error instanceof Error ? error.message : "Could not load the count";
            } finally {
                refresh.disabled = false;
            }
        }

        refresh.addEventListener("click", loadCount);
        loadCount();
    </script>
</body>
</html>
